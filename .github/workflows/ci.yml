name: SVA Tri-Runtime Conformance & Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Run Tri-Runtime Conformance (Node.js, W3C WebCrypto, Single-File Java)
        run: npm run conformance
      - name: Run Full Test Suite (Specs, Playgrounds, Packages)
        run: npm test
